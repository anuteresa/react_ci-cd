on:
  push:
 

jobs:
  check-version:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
      
      - name: Get current package version     
        id: package-version
        uses: martinbeentjes/npm-get-version-action@v1.3.1

      - name: Get branch name
        id: get_branch
        run: echo "branch_name=${GITHUB_REF#refs/heads/}" >> $GITHUB_ENV

      - name: Set Git Identity
        run: |
          git config --global user.email "anuteresaj@gmail.com"
          git config --global user.name "anuteresa"      
       

      - name: Read package version
        id: read_package_version
        run: |
          package_version=$(node -p "require('./package.json').version")
          # Strip off -rc.X suffix if present
          clean_package_version=$(echo $package_version | sed 's/-rc\.[0-9]*//')
          echo "package_version=$clean_package_version" >> $GITHUB_ENV

      - name: Check version
        run: |
          if [[ "$branch_name" =~ ^(release|hotfix)/v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            branch_version=${BASH_REMATCH[2]}
            if [ "$branch_version" != "$package_version" ]; then
              echo "Version mismatch: package.json ($package_version) !== branch ($branch_version)"
              git pull origin ${{ steps.branch.outputs.BRANCH_NAME }}
              jq --arg new_version "$branch_version" '.version = $new_version' package.json > tmp.$$.json && mv tmp.$$.json package.json
              git add package.json
              git commit -m "Bump version to $branch_version" -n
              git tag “v$branch_version”
             git push origin ${{ steps.branch.outputs.BRANCH_NAME }} --follow-tags
              
            else
              echo "Version match: $package_version"
            fi
          else
            echo "Branch name $branch_name does not follow the format release/vX.X.X"
          fi   

 
