      - name: Set Git Identity
        run: |
          git config --global user.email "anuteresaj@gmail.com"
          git config --global user.name "anuteresa"   

    


      - name: Get latest commit hash
        id: latest_commit
        run: |
             last_commit=$(git rev-parse HEAD)
             echo "last_commit=${last_commit}" >> $GITHUB_OUTPUT


      - name: Get tags associated with the latest commit
        id: latest_tags
        run: |
             tags=$(git tag --points-at $(git rev-parse HEAD))
             echo "tags=${tags}" >> $GITHUB_OUTPUT
             

      - name: Check if latest commit is tagged
        run: |
         latest_tags="${{ steps.latest_tags.outputs.tags }}"
         if [ -n "$latest_tags" ]; then
          echo "Latest commit is tagged"
          for tag in $latest_tags; do
            if [[ "$tag" != *"-"* ]]; then
              echo "Tag $tag is a stable version"
            else
              echo "Tag $tag is not a stable version"
              
              new_tag=$(echo "$tag" | sed 's/-[^-]*$//')
              echo "New tag: $new_tag"
              npm version 
              ls -la
              git push origin main --follow-tags
            fi
          done
         else
          echo "Latest commit is not tagged"
          tag=$(git describe --tags $(git rev-list --tags --max-count=1))
          echo "tag=${tag}" >> $GITHUB_OUTPUT
          echo "$tag" 
          npm version patch
          git push origin main --follow-tags
         fi
            

