

# This workflow will do a clean installation of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-nodejs-with-github-actions

name: production CI

on:
  push:
   

  

jobs:
  run-build-if-needed:
    runs-on: ubuntu-latest
     
   
    steps:

       - uses: actions/checkout@v3
 
       - name: Setup Node.js
         uses: actions/setup-node@v2
         with:
          node-version: '14'
          
       - name: Install semver
         run: npm install -g semver
        
       - name: Get current package version     
         id: package-version
         uses: martinbeentjes/npm-get-version-action@v1.3.1

       - name: Increment version to release candidate
         id: increment_version
         run:  |
              echo "latest_commit=$(semver v2.3.4 -i prerelease --preid rc)" >> $GITHUB_OUTPUT
              echo $latest_commit

       - name: Output release candidate version
         run: echo "The release candidate version is ${{ steps.increment_version.outputs.latest_commit }}"  

       - name: Set Git Identity
   
         run: |         
          git config --global user.email "anuteresaj@gmail.com"
          git config --global user.name "anuteresa" 
   
         
       - name: Update package.json version
         run: npm version prerelease --preid=rc  

      
       - name: Commit changes
         run: |
          git add package.json
          git commit -m "Update workflow file"
          git push origin main
          
         
     
 


   

        

          
    

   
        
    


 
    
 
