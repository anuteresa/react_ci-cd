name: Nightly Deployment

on:
  workflow_dispatch:
 
  repository_dispatch: 
      types: [trigger-workflow]  
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2
