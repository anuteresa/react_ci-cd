name: Nightly Deployment

on:
  release:
    types: [published]
 
  repository_dispatch: 
      types: [trigger-workflow]  
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2
        with:
         ref: main
     

        # Retrieves the version from package.json
      - name: Get current package version     
        id: package-version
        uses: martinbeentjes/npm-get-version-action@v1.3.1

      - name: Set Git Identity
   
        run: |
          echo '${{ steps.version.outputs.version}} '
          git config --global user.email "anuteresaj@gmail.com"
          git config --global user.name "anuteresa" 

      - name: Get repository metadata
        id: metadata
        run: |
          curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
          https://api.github.com/repos/${{ github.repository }}/actions/metadata \
          | jq '.["created_by_api"]' \
          > created_by_api.txt

      - name: Read repository metadata
        run: |
          CREATED_BY_API=$(cat created_by_api.txt)
          echo "CREATED_BY_API: $CREATED_BY_API"
          # Use CREATED_BY_API to determine how the release was created     

          
  deploy2:
     runs-on: ubuntu-latest
     if: success() && github.event_name == 'repository_dispatch'
     needs: [deploy]

     steps:
      - name: Checkout code
        uses: actions/checkout@v2
        with:
         ref: main      


       
