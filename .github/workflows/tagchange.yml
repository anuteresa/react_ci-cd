name: Nightly Deployment

on:
  push: # Runs every day at 5 PM UTC (adjust the time zone as needed)
  workflow_dispatch: 

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2
      - run:  |
            git fetch --prune --unshallow --tags 
            cat tes.py   

      - name: Get latest tag commit
        id: get_tag_commit
        run: |
          last_tag_commit=$(git rev-list --tags --max-count=1)
          echo "Last tag commit SHA: $last_tag_commit"
          echo "last_tag_commit=${last_tag_commit}" >> $GITHUB_OUTPUT

      - name: Get latest commit in branch
        id: get_latest_commit
        run: |
          latest_commit=$(git rev-parse HEAD)
          echo "Latest commit SHA: $latest_commit"
            echo "latest_commit=${latest_commit}" >> $GITHUB_OUTPUT

      - name: Send mail
        uses: dawidd6/action-send-mail@v3.12.0
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ssouser714@gmail.com 
          password: fbnz shnc pkpv fpds
          subject: Github Actions job '${{ github.workflow }}' of '${{ github.repository }}' Succeded
          body: The job '${{ github.job }}' in worflow '${{ github.workflow }}' of '${{ github.repository }}' succeded.
          to: ssouser714@gmail.com
          from: ssouser714@gmail.com   

      - name: Check for changes
        id: check_changes
        run: |
          if [ "${{ steps.get_tag_commit.outputs.last_tag_commit }}" != "${{ steps.get_latest_commit.outputs.latest_commit }}" ]; then
            echo "Changes detected since the last deployment."
          
            echo "changes_detected=true" >> $GITHUB_OUTPUT
          else
            echo "No changes detected since the last deployment."
             echo "changes_detected=false" >> $GITHUB_OUTPUT
          fi

      # Continue with deployment steps only if changes were detected
      - name: Deploy if changes detected
        if: steps.check_changes.outputs.changes_detected == 'true'
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # This token is provided by Actions, you do not need to create your own token
        with:
          tag_name: v2.5.7
          release_name: Release v2.5.7
          draft: false
          prerelease: false
          
     
      - name: Get previous release tag
        if: failure()
        id: previous-release
        uses: sammcoe/get-previous-release-action@v1.0.3 

      - name: Updating Release
        run: echo 'reelasae=${{ steps.previous-release.output.release }}'

      - name: Set Git Identity
        if: failure()
        run: |
          git config --global user.email "anuteresaj@gmail.com"
          git config --global user.name "anuteresa" 

      - name: Redeploy previous tag on failure
        if: failure()
        run: |
          previous_tag=$(git describe --tags --abbrev=0)
          echo "Previous tag: $previous_tag"
          
          curl -X POST \
           -H "Accept: application/vnd.github.v3+json" \
          -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
          -d "{\"ref\":\"$previous_tag\"}" \
          https://api.github.com/repos/${{ github.repository }}/actions/workflows/90263043/dispatches 
          
         
    
