             https://api.github.com/repos/anuteresa/react_ci-cd/actions/workflows/92242166/dispatches \
           -d '{"ref": "main"}'  
      - name: Set API
        run: |
              curl -X POST \
                 -H "Accept: application/vnd.github+json" \
                 -H "Authorization: Bearer ${{ secrets.PAT }}" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                "https://api.github.com/repos/$repo/dispatches" \
                -d "{\"event_type\": \"trigger-worklow\"}"    
      
        
      # Create release
      - name: Create Release
        uses: actions/create-release@v1
