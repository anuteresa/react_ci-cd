name: Update Version and Merge

on:
  push:
    branches: 
          - dev
          
jobs:
  check-version:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0 # Fetch all history for all tags and branches
          ref: dev
      - name: Get version from package.json
        id: get_version
        run: |
          version=$(node -p "require('./package.json').version")
          echo "version=$version" >> $GITHUB_OUTPUT

      - name: Check if version is an RC version
        id: check_rc_version
        run: |
          if [[ "${{ steps.get_version.outputs.version }}" == *-rc* ]]; then
            echo "is_rc=true" >> $GITHUB_OUTPUT
          else
            echo "is_rc=false" >> $GITHUB_OUTPUT
          fi

      - name: Set Git Identity
        run: |
          git config --global user.email "anuteresaj@gmail.com"
          git config --global user.name "anuteresa"        

      - name: Process RC version
        if: ${{ steps.check_rc_version.outputs.is_rc == 'true' }}
        run: |
          # Extract base version without RC suffix
          base_version=$(echo ${{ steps.get_version.outputs.version }} | sed 's/-rc[0-9]*//')
          echo "base_version=$base_version" >> $GITHUB_OUTPUT

          # Update version in package.json to main version
          npm version $base_version --allow-same-version --no-git-tag-version

          # Commit changes
          #git add .
          #git commit -m "Update version to $base_version"
          #git push origin main

      - name: Create Pull Request
        id: demo-pr
        uses: peter-evans/create-pull-request@v4

      # Approve the PR automatically
    #  - name: Approve Pull Request
     #   if: ${{ steps.demo-pr.outputs.pull-request-number }}
      #  uses: juliangruber/approve-pull-request-action@v2.0.6
       # with:
        #  github-token: ${{ secrets.GITHUB_TOKEN}}
         # number: ${{ steps.demo-pr.outputs.pull-request-number }}

      - uses: hmarr/auto-approve-action@v4
        with:
          pull-request-number: ${{ steps.demo-pr.outputs.pull-request-number }} 
          github-token: ${{ secrets.PAT }}

      # Merge the PR automatically
      - name: Merge Pull Request
        if: ${{ steps.demo-pr.outputs.pull-request-number }}
        uses: juliangruber/merge-pull-request-action@v1.1.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          number: ${{ steps.demo-pr.outputs.pull-request-number }}
          method: squash    

      - name: Set Git Identity
        run: |
          git config --global user.email "anuteresaj@gmail.com"
          git config --global user.name "anuteresa"     

      - name: Checkout and update develop branch
        if: ${{ steps.check_rc_version.outputs.is_rc == 'true' }}
        run: |
          git fetch origin
          git checkout -b main origin/main
          # Update version in package.json to main version to avoid conflict
          base_version=$(echo ${{ steps.get_version.outputs.version }} |  sed 's/-rc[0-9]*//')
          npm version $base_version --allow-same-version --no-git-tag-version
          git add package.json package-lock.json
          git commit -m "Update version to $base_version in develop"
          git push origin main

      - name: Merge main into develop
        if: ${{ steps.check_rc_version.outputs.is_rc == 'true' }}
        run: |
          git fetch origin
          git checkout main
          git pull origin main
          git merge origin/dev --no-ff --no-edit || true
          git push origin main


      - name: Output if no action needed
        if: ${{ steps.check_rc_version.outputs.is_rc == 'false' }}
        run: echo "The version in package.json is not an RC version. No action needed."
