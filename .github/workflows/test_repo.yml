name: Nightly Deployment

on:
 pull_request: 
jobs:
  deploy:
    runs-on: ubuntu-latest
    outputs:
     output1: ${{ steps.check_changes.outputs.changes_detected }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v2
        with:
         ref: development
      - run:  |
            git fetch --prune --unshallow --tags    
      - name: Set API
        id: get_tag
        run: |
             response=$(curl -s -X GET \
                      -H "Accept: application/vnd.github.v3+json" \
                       https://api.github.com/repos/anuteresa/react_ci-cd/releases/latest | jq -r '.tag_name')
                       last_tag=$response
                       echo "Last tag commit SHA: $last_tag"
                       echo "last_tag=${last_tag}" >> $GITHUB_OUTPUT 
                       echo "$last_tag"
 
      - name: Set 
        id: get_tag_commit
        run: |
              response=$( git rev-list -n 1 "${{ steps.get_tag.outputs.last_tag }}")
               last_tag_commit=$response
                echo "Last tag commit SHA: $last_tag_commit"
                echo "last_tag_commit=${last_tag_commit}" >> $GITHUB_OUTPUT 
                echo "$last_tag_commit"

      - name: Get latest tag commit
        id: get_new_tag_commit
        run: |
          new_tag_commit=$(git rev-list --tags --max-count=1)
          echo "Last tag commit SHA: $new_tag_commit"
          echo "new_tag_commit=${new_tag_commit}" >> $GITHUB_OUTPUT                    

      - name: Get latest commit in branch
        id: get_latest_commit
        run: |
          latest_commit=$(git rev-parse HEAD)
          echo "Latest commit SHA: $latest_commit"
          echo "latest_commit=${latest_commit}" >> $GITHUB_OUTPUT
 

      - name: Check for changes
        id: check_changes
        run: |
          if [ "${{ steps.get_tag_commit.outputs.last_tag_commit }}" != "${{ steps.get_latest_commit.outputs.latest_commit }}" ]; then
            echo "Changes detected since the last deployment."
          
            echo "changes_detected=true" >> $GITHUB_OUTPUT
          else
            echo "No changes detected since the last deployment."
             echo "changes_detected=false" >> $GITHUB_OUTPUT
          fi   
      - name: Get next version
        uses: reecetech/version-increment@2024.4.3
        id: version
        with:
          scheme: semver
          increment: patch   

      - name: Create Release
        run:  |
            curl -X POST \
            -H "Accept: application/vnd.github+json" \
             -H "Authorization: Bearer ${{ secrets.PAT }}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/anuteresa/react_ci-cd/releases \
             -d '{"tag_name":"v${{ steps.version.outputs.version }}","target_commitish":"development","name":"v${{ steps.version.outputs.version}}","generate_release_notes":true}' 
          
      
         

              

                    
                    
