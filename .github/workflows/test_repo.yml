name: Nightly Deployment

on:
 push: 
jobs:
  deploy:
    runs-on: ubuntu-latest
    outputs:
     output1: ${{ steps.check_changes.outputs.changes_detected }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v2
        with:
         ref: development
      - name: Set API
        id: get_tag_commit
        run: |
             response=$(curl -s -X GET \
                      -H "Accept: application/vnd.github.v3+json" \
                       https://api.github.com/repos/anuteresa/react_ci-cd/releases/latest | jq -r '.tag_name')
                       last_tag=$response
                       echo "Last tag commit SHA: $last_tag"
                       echo "last_tag=${last_tag}" >> $GITHUB_OUTPUT 
                       echo "$last_tag"
 
      - name: Set 
        run: |
             git rev-list -n 1 "${{ steps.get_tag_commit.outputs.last_tag }}"

              

                    
                    
