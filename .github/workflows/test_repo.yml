name: Nightly Deployment

on:
 push: 
jobs:
  deploy:
    runs-on: ubuntu-latest
    outputs:
     output1: ${{ steps.check_changes.outputs.changes_detected }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v2
        with:
         ref: main
      - name: Set API
        run: |
              curl -s -X GET \
                  -H "Accept: application/vnd.github.v3+json" \
                    https://api.github.com/repos/anuteresa/react_ci-cd/releases/latest | jq -r '.tag_name'
