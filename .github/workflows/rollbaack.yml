name: Rollback

on:
  push:
  repository_dispatch: 
      types: [trigger]
   
jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Get current package version
        id: package-version
        uses: martinbeentjes/npm-get-version-action@v1.3.1
              
  deploy2:
     runs-on: ubuntu-latest
     if: success() 
     needs: [deploy]

     steps:
      - name: Checkout code
        uses: actions/checkout@v2
        with:
         ref: main     

      - run:  |
            git fetch --prune --unshallow --tags 
            cat tes.py   

      - name: Get latest tag commit
        id: get_tag_commit
        run: |
          last_tag_commit=$(git rev-list --tags --max-count=1)
          echo "Last tag commit SHA: $last_tag_commit"
          echo "last_tag_commit=${last_tag_commit}" >> $GITHUB_OUTPUT

      - name: Get latest commit in branch
        id: get_latest_commit
        run: |
          latest_commit=$(git rev-parse HEAD)
          echo "Latest commit SHA: $latest_commit"
            echo "latest_commit=${latest_commit}" >> $GITHUB_OUTPUT
 

      - name: Check for changes
        id: check_changes
        run: |
          if [ "${{ steps.get_tag_commit.outputs.last_tag_commit }}" != "${{ steps.get_latest_commit.outputs.latest_commit }}" ]; then
            echo "Changes detected since the last deployment."
          
            echo "changes_detected=true" >> $GITHUB_OUTPUT
          else
            echo "No changes detected since the last deployment."
             echo "changes_detected=false" >> $GITHUB_OUTPUT
          fi   
      
      - name: Get next version
        if: steps.check_changes.outputs.changes_detected == 'true'
        uses: reecetech/version-increment@2024.4.3
        id: version
        with:
          scheme: semver
          increment: patch

      - name: Create Release
        if: steps.check_changes.outputs.changes_detected == 'true'
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # This token is provided by Actions, you do not need to create your own token
        with:
          tag_name: v${{ steps.version.outputs.version }}
          release_name: v${{ steps.version.outputs.version }}
          draft: false
          prerelease: false  

      - name: Create Release  
        if: steps.check_changes.outputs.changes_detected == 'true'  
        run:  |
            repos=(
            "anuteresa/ci-cd"
             "anuteresa/react_ci-cd"
             )
   
            for repo in "${repos[@]}"; do
               curl -X POST \
                 -H "Accept: application/vnd.github+json" \
                 -H "Authorization: Bearer ${{ secrets.PAT }}" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                "https://api.github.com/repos/$repo/dispatches" \
                -d "{\"event_type\": \"trigger-workflow\"}"
            done   
